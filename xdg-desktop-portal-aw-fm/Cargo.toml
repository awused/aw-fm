[package]
name = "xdg-desktop-portal-aw-fm"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.92"
color-eyre = "0.6.5"
# ashpd = { version = "0.13.11", features = ["tokio", "backend", "file_chooser"] }
ashpd = { git = "https://github.com/bilelmoussaoui/ashpd", branch = "main", features = ["tokio", "backend", "file_chooser"] }
futures-util = { version = "0.3.34", default-features = false }
tokio = { version = "1.54.1", features = ["macros", "process", "rt", "sync", "time"] }
